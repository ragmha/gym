name: update

on:
  push:
    branches: [main]

concurrency:
  group: production-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    name: EAS Update (Production)
    runs-on: ubuntu-latest
    outputs:
      release-action: ${{ steps.runtime.outputs.action }}
    steps:
      - name: Check for EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::You must provide an EXPO_TOKEN secret. Learn more: https://docs.expo.dev/eas-update/github-actions"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check production release readiness
        run: bun scripts/check-production-release.ts

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Resolve runtime anchor
        id: baseline
        env:
          HISTORY_COMMIT: ${{ github.event.before }}
          CURRENT_COMMIT: ${{ github.sha }}
          RELEASE_EVENT: push
        run: bun scripts/fingerprint-release.ts --resolve-baseline

      - name: Checkout fingerprint baseline
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.baseline.outputs.baseline-commit }}
          path: .expo/release-baseline
          persist-credentials: false

      - name: Compare verified native fingerprints
        id: fingerprint
        env:
          HISTORY_COMMIT: ${{ github.event.before }}
          BASE_COMMIT: ${{ steps.baseline.outputs.baseline-commit }}
          CURRENT_COMMIT: ${{ github.sha }}
          RELEASE_EVENT: push
          BASE_DIRECTORY: .expo/release-baseline
          EXPO_NO_DOTENV: '1'
        run: bun scripts/fingerprint-release.ts

      - name: Enforce runtime isolation
        id: runtime
        env:
          HISTORY_COMMIT: ${{ github.event.before }}
          BASE_COMMIT: ${{ steps.baseline.outputs.baseline-commit }}
          CURRENT_COMMIT: ${{ github.sha }}
          RELEASE_EVENT: push
          FINGERPRINT_BASE_COMMIT: ${{ steps.fingerprint.outputs.previous-git-commit }}
          FINGERPRINT_CURRENT_COMMIT: ${{ steps.fingerprint.outputs.current-git-commit }}
          PREVIOUS_FINGERPRINT: ${{ steps.fingerprint.outputs.previous-fingerprint }}
          CURRENT_FINGERPRINT: ${{ steps.fingerprint.outputs.current-fingerprint }}
          FINGERPRINT_DIFF: ${{ steps.fingerprint.outputs.fingerprint-diff }}
        run: bun scripts/check-release-safety.ts

      - name: Publish update
        if: steps.runtime.outputs.action == 'update'
        run: |
          eas update --channel production --environment production \
            --platform ios --message "$GITHUB_SHA" --non-interactive

  build:
    name: Build and submit iOS
    needs: update
    if: needs.update.outputs.release-action == 'build'
    uses: ./.github/workflows/build.yml
    with:
      platform: ios
      profile: production
      auto_submit: true
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
