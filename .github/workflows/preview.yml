name: preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: PR Quality Gates
    runs-on: ubuntu-latest
    outputs:
      release-action: ${{ steps.runtime.outputs.action }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Expo dependency alignment
        run: bun run expo:check

      - name: Run Expo Doctor
        run: bun run expo:doctor

      - name: Run linter
        run: bun run lint

      - name: Run typecheck
        run: bun run typecheck

      - name: Run unit tests
        run: bun run test:unit -- --runInBand --no-watchman

      - name: Resolve runtime anchor
        id: baseline
        env:
          HISTORY_COMMIT: ${{ github.event.pull_request.base.sha }}
          CURRENT_COMMIT: ${{ github.sha }}
          RELEASE_EVENT: pull_request
        run: bun scripts/fingerprint-release.ts --resolve-baseline

      - name: Checkout fingerprint baseline
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.baseline.outputs.baseline-commit }}
          path: .expo/release-baseline
          persist-credentials: false

      - name: Compare verified native fingerprints
        id: fingerprint
        env:
          HISTORY_COMMIT: ${{ github.event.pull_request.base.sha }}
          BASE_COMMIT: ${{ steps.baseline.outputs.baseline-commit }}
          CURRENT_COMMIT: ${{ github.sha }}
          RELEASE_EVENT: pull_request
          BASE_DIRECTORY: .expo/release-baseline
          EXPO_NO_DOTENV: '1'
        run: bun scripts/fingerprint-release.ts

      - name: Enforce runtime isolation
        id: runtime
        env:
          HISTORY_COMMIT: ${{ github.event.pull_request.base.sha }}
          BASE_COMMIT: ${{ steps.baseline.outputs.baseline-commit }}
          CURRENT_COMMIT: ${{ github.sha }}
          RELEASE_EVENT: pull_request
          FINGERPRINT_BASE_COMMIT: ${{ steps.fingerprint.outputs.previous-git-commit }}
          FINGERPRINT_CURRENT_COMMIT: ${{ steps.fingerprint.outputs.current-git-commit }}
          PREVIOUS_FINGERPRINT: ${{ steps.fingerprint.outputs.previous-fingerprint }}
          CURRENT_FINGERPRINT: ${{ steps.fingerprint.outputs.current-fingerprint }}
          FINGERPRINT_DIFF: ${{ steps.fingerprint.outputs.fingerprint-diff }}
        run: bun scripts/check-release-safety.ts

  preview:
    name: EAS Update (Preview)
    needs: test
    if: needs.test.outputs.release-action == 'update' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check for EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::You must provide an EXPO_TOKEN secret. Learn more: https://docs.expo.dev/eas-update/github-actions"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Create preview update
        run: eas update --auto
