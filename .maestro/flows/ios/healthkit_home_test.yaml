appId: io.raghib.gym
name: HealthKit Home Screen Test

---
- runFlow:
    file: ../common/startup.yaml

# The dashboard is read-only: rings, weight and the activity heatmap all
# render from HealthKit, so there is nothing to tap to enter data.
- assertVisible: 'Fitness Metrics'
- assertVisible: 'Weight'
- takeScreenshot: healthkit_home_initial

# Without HealthKit authorization the rings render at zero rather than blank.
- assertVisible: 'Steps'
- assertVisible: 'Sleep'
- takeScreenshot: healthkit_home_rings

# "See All" opens the full metric breakdown.
- tapOn: 'See All'
- waitForAnimationToEnd
- takeScreenshot: healthkit_fitness_metrics
