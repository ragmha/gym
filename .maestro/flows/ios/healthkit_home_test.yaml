appId: io.raghib.gym
name: HealthKit Home Screen Test

---
- runFlow:
    file: ../common/startup.yaml

# The default overview is read-only and keeps secondary data collapsed.
- assertVisible: 'Recovery'
- assertVisible: 'More health data'
- assertNotVisible: 'Weight'
- takeScreenshot: healthkit_home_initial

# Missing HealthKit measurements render as -- rather than invented zeroes.
- assertVisible: 'Steps.*'
- assertVisible: 'Sleep.*'
- takeScreenshot: healthkit_home_overview

- tapOn: 'More health data'
- waitForAnimationToEnd
- assertVisible: 'Weight'
- scrollUntilVisible:
    element: 'RECENT ACTIVITY'
    direction: DOWN
- takeScreenshot: healthkit_home_details

# The existing full metric breakdown remains reachable.
- scrollUntilVisible:
    element: 'See all metrics'
    direction: DOWN
- tapOn: 'See all metrics'
- waitForAnimationToEnd
- takeScreenshot: healthkit_fitness_metrics
